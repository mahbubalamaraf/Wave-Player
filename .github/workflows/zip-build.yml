name: Build APK From ZIP

on:
  push:
    branches:
      - master
    paths:
      - 'Wave-2.8.123-no-effects.zip'
      - '.github/workflows/zip-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted wave-source

          unzip -q Wave-2.8.123-no-effects.zip -d extracted

          PROJECT=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle project not found!"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT")
          cp -a "$PROJECT_ROOT/." wave-source/
          chmod +x wave-source/gradlew

          echo "Project extracted successfully"

      - name: Setup Android Build
        uses: ./wave-source/.github/actions/setup

      - name: Set Version
        shell: bash
        run: |
          echo "VC=$((${{ github.run_number }} + 100))" >> "$GITHUB_ENV"
          echo "VER=2.8.$((${{ github.run_number }} + 100))" >> "$GITHUB_ENV"

      - name: Setup Keystore
        shell: bash
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          STORE: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > wave-source/keystore.jks

            cat > wave-source/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$STORE
          keyAlias=$ALIAS
          keyPassword=$PASS
          EOF
          fi

      - name: Build APK
        id: build
        working-directory: wave-source
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleDev \
            -Pvc="$VC" \
            -Pvn="$VER" \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee build-error.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wave-APK-${{ github.run_number }}
          path: wave-source/app/build/outputs/apk/dev/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wave-Build-Diagnostic-Log
          path: wave-source/build-error.log
          if-no-files-found: ignore
          retention-days: 7
